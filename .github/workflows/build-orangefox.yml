name: OrangeFox Recovery - Xiaomi 12 (cupid)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: orangefox-cupid-build
  cancel-in-progress: false

jobs:
  build:
    name: Build recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DEVICE: cupid
      DEVICE_PATH: device/xiaomi/cupid
      COMMON_PATH: device/xiaomi/sm8450-common
      DEVICE_BRANCH: lineage-24.0
      COMMON_BRANCH: lineage-24.0
      VENDOR_BRANCH: lineage-24.0
      FOX_BRANCH: "16.0"
      ANDROID_JOBS: "2"
      DEVICE_REPO: https://github.com/nandaraffi/android_device_xiaomi_cupid.git
      COMMON_REPO: https://github.com/nandaraffi/android_device_xiaomi_sm8450-common.git
      VENDOR_DEVICE_REPO: https://github.com/TheMuppets/proprietary_vendor_xiaomi_cupid.git
      VENDOR_COMMON_REPO: https://github.com/TheMuppets/proprietary_vendor_xiaomi_sm8450-common.git
      HARDWARE_REPO: https://github.com/LineageOS/android_hardware_xiaomi.git
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_xiaomi_sm8450.git
      DTBO_REPO: https://github.com/LineageOS/android_kernel_xiaomi_sm8450-devicetrees.git
      MODULES_REPO: https://github.com/LineageOS/android_kernel_xiaomi_sm8450-modules.git
      QCOM_COMMON_REPO: https://github.com/LineageOS/android_hardware_qcom-caf_common.git
      SEPOLICY_REPO: https://github.com/LineageOS/android_device_qcom_sepolicy_vndr.git

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lz4 \
            openjdk-17-jdk python3 python-is-python3 rsync unzip wget zip zlib1g-dev

      - name: Configure Git and repo tool
        shell: bash
        run: |
          set -e
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@example.invalid"
          git config --global color.ui false
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "===== DISK BEFORE CLEANUP ====="
          df -h /
          echo "===== REMOVE UNUSED PREINSTALLED TOOLS ====="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean
          sudo docker system prune -af 2>/dev/null || true
          echo "===== DISK AFTER CLEANUP ====="
          df -h /

      - name: Initialize and sync OrangeFox
        shell: bash
        run: |
          set -eo pipefail
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$RUNNER_TEMP/orangefox-sync"
          cd "$RUNNER_TEMP/orangefox-sync"
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$GITHUB_WORKSPACE/android"

      - name: Check disk space after OrangeFox sync
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          df -h "$GITHUB_WORKSPACE"
          AVAILABLE_KB="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          if [ "$AVAILABLE_KB" -lt 15000000 ]; then
            echo "::error::Less than 15 GB free after OrangeFox sync; runner disk space is insufficient."
            exit 1
          fi

      - name: Add swap for the build
        shell: bash
        run: |
          set -euo pipefail
          # The build system warns that it wants ~16GB of RAM and the runner
          # only has 15.6GB. soong_build runs right after lunch and is the
          # memory-heavy step; without headroom the runner gets killed
          # mid-bootstrap (exit 143, "runner has received a shutdown signal").
          #
          # The runner already ships a 3GB /swapfile, so add a second one
          # rather than resizing it. Only do this when there is enough disk
          # left: the OrangeFox sync already leaves ~25GB free and the build
          # still needs space for out/.
          if sudo swapon --show | grep -q /swapfile2; then
            echo "second swapfile already active"
          else
            AVAILABLE_GB="$(df -Pk / | awk 'NR==2 {print int($4 / 1048576)}')"
            if [ "$AVAILABLE_GB" -ge 20 ]; then
              # dd, not fallocate: a swapfile must not contain holes.
              sudo dd if=/dev/zero of=/swapfile2 bs=1M count=8192 status=none
              sudo chmod 600 /swapfile2
              sudo mkswap /swapfile2
              sudo swapon /swapfile2
              echo "second swapfile enabled"
            else
              echo "::warning::Only ${AVAILABLE_GB} GB free; skipping extra swapfile"
            fi
          fi
          free -h
          sudo swapon --show || true

      - name: Verify required LineageOS branches
        shell: bash
        run: |
          set -eo pipefail
          check_branch() {
            echo "Checking $1 [$2]"
            git ls-remote --exit-code --heads "$1" "refs/heads/$2" >/dev/null
          }
          check_branch "$DEVICE_REPO" "$DEVICE_BRANCH"
          check_branch "$COMMON_REPO" "$COMMON_BRANCH"
          check_branch "$VENDOR_DEVICE_REPO" "$VENDOR_BRANCH"
          check_branch "$VENDOR_COMMON_REPO" "$VENDOR_BRANCH"
          check_branch "$HARDWARE_REPO" "$DEVICE_BRANCH"
          check_branch "$KERNEL_REPO" "$DEVICE_BRANCH"
          check_branch "$DTBO_REPO" "$DEVICE_BRANCH"
          check_branch "$MODULES_REPO" "$DEVICE_BRANCH"

          # hardware/qcom-caf/common from lineage-22.2 onward is written for
          # LineageOS's own build/soong: its Android.bp uses the "mkdir" module
          # type and select() on install_symlink's symlink_target, neither of
          # which the OrangeFox build/soong fork implements. Parsing it aborts
          # the whole build at soong bootstrap. lineage-21.0 is the newest
          # branch whose Android.bp the fox_16.0 soong can parse.
          if git ls-remote --exit-code --heads "$QCOM_COMMON_REPO" "refs/heads/lineage-21.0" >/dev/null 2>&1; then
            echo "QCOM_COMMON_BRANCH=lineage-21.0" >> "$GITHUB_ENV"
          else
            echo "::error::lineage-21.0 branch not found in $QCOM_COMMON_REPO"
            exit 1
          fi

          # WLAN and the vendor display/dataservices trees are separate repos
          # that the device trees reference by path.
          echo "QCOM_WLAN_BRANCH=lineage-24.0-caf" >> "$GITHUB_ENV"
          echo "QCOM_VENDOR_BRANCH=lineage-21.0" >> "$GITHUB_ENV"

          # Select an actually published SM8450 vendor sepolicy branch.
          if git ls-remote --exit-code --heads "$SEPOLICY_REPO" "refs/heads/lineage-24.0-caf-sm8450" >/dev/null 2>&1; then
            echo "SEPOLICY_BRANCH=lineage-24.0-caf-sm8450" >> "$GITHUB_ENV"
          elif git ls-remote --exit-code --heads "$SEPOLICY_REPO" "refs/heads/lineage-23.2-caf-sm8450" >/dev/null 2>&1; then
            echo "SEPOLICY_BRANCH=lineage-23.2-caf-sm8450" >> "$GITHUB_ENV"
          elif git ls-remote --exit-code --heads "$SEPOLICY_REPO" "refs/heads/lineage-22.2-caf-sm8450" >/dev/null 2>&1; then
            echo "SEPOLICY_BRANCH=lineage-22.2-caf-sm8450" >> "$GITHUB_ENV"
          else
            echo "::error::No compatible SM8450 sepolicy branch found in $SEPOLICY_REPO"
            exit 1
          fi

      - name: Fetch Xiaomi 12 device tree
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          git clone --depth=1 -b "$DEVICE_BRANCH" "$DEVICE_REPO" "$DEVICE_PATH"

      - name: Fetch SM8450 common device tree
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          git clone --depth=1 -b "$COMMON_BRANCH" "$COMMON_REPO" "$COMMON_PATH"

      - name: Fetch Xiaomi hardware, Qualcomm common, and kernel dependencies
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          git clone --depth=1 -b "$DEVICE_BRANCH" "$HARDWARE_REPO" hardware/xiaomi
          git clone --depth=1 -b "$QCOM_COMMON_BRANCH" "$QCOM_COMMON_REPO" hardware/qcom-caf/common

          # hardware/qcom-caf/common is only needed for its makefiles; the
          # device trees inherit common.mk and include the os_pickup_* files.
          test -f hardware/qcom-caf/common/common.mk || {
            echo "::error::hardware/qcom-caf/common/common.mk is missing"
            exit 1
          }
          test -f hardware/qcom-caf/common/os_pickup_qssi.bp || {
            echo "::error::hardware/qcom-caf/common/os_pickup_qssi.bp is missing"
            exit 1
          }
          test -f hardware/qcom-caf/common/os_pickup_sepolicy_vndr.mk || {
            echo "::error::os_pickup_sepolicy_vndr.mk is missing"
            exit 1
          }

          # Vendor sepolicy: the whole repo, which carries SEPolicy.mk at its
          # root (there is no sm8450/ subproject in this branch).
          git clone --depth=1 -b "$SEPOLICY_BRANCH" "$SEPOLICY_REPO" device/qcom/sepolicy_vndr
          test -f device/qcom/sepolicy_vndr/SEPolicy.mk || {
            echo "::error::SEPolicy.mk is missing from branch $SEPOLICY_BRANCH"
            find device/qcom/sepolicy_vndr -maxdepth 2 -type f -print | head -100
            exit 1
          }

          # hardware/qcom-caf/sm8450 is a stub namespace whose Android.bp is the
          # qssi pickup from common.
          mkdir -p hardware/qcom-caf/sm8450
          cp hardware/qcom-caf/common/os_pickup_qssi.bp hardware/qcom-caf/sm8450/Android.bp

          # WLAN driver tree, referenced by path from the device trees.
          git clone --depth=1 -b "$QCOM_WLAN_BRANCH" \
            https://github.com/LineageOS/android_hardware_qcom_wlan.git \
            hardware/qcom-caf/wlan
          test -f hardware/qcom-caf/wlan/Android.bp || {
            echo "::error::hardware/qcom-caf/wlan/Android.bp is missing"
            exit 1
          }

          # Vendor display/dataservices trees. sm8450-common's Android.bp
          # declares a soong_namespace importing
          # vendor/qcom/opensource/commonsys-intf/display, so it must exist.
          for entry in \
            "android_vendor_qcom_opensource_display-commonsys-intf vendor/qcom/opensource/commonsys-intf/display" \
            "android_vendor_qcom_opensource_display-commonsys vendor/qcom/opensource/commonsys/display" \
            "android_vendor_qcom_opensource_display vendor/qcom/opensource/display" \
            "android_vendor_qcom_opensource_dataservices vendor/qcom/opensource/dataservices"; do
            repo="${entry%% *}"
            dest="${entry#* }"
            git clone --depth=1 -b "$QCOM_VENDOR_BRANCH" \
              "https://github.com/LineageOS/${repo}.git" "$dest"
            test -f "$dest/Android.bp" || {
              echo "::error::Android.bp is missing: $dest"
              exit 1
            }
          done

          git clone --depth=1 -b "$DEVICE_BRANCH" "$KERNEL_REPO" kernel/xiaomi/sm8450
          git clone --depth=1 -b "$DEVICE_BRANCH" "$DTBO_REPO" kernel/xiaomi/sm8450-devicetrees
          git clone --depth=1 -b "$DEVICE_BRANCH" "$MODULES_REPO" kernel/xiaomi/sm8450-modules

      - name: Check runner resources before vendor fetch
        shell: bash
        run: |
          echo "===== MEMORY ====="
          free -h || true
          echo "===== DISK ====="
          df -h "$GITHUB_WORKSPACE" || true
          echo "===== CPU ====="
          nproc || true

      - name: Fetch Xiaomi cupid vendor tree
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/android"
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          for attempt in 1 2 3; do
            echo "Clone vendor/xiaomi/cupid attempt ${attempt}/3"
            if git clone --depth=1 --single-branch -b "$VENDOR_BRANCH" "$VENDOR_DEVICE_REPO" vendor/xiaomi/cupid; then
              break
            fi
            rm -rf vendor/xiaomi/cupid
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not clone Xiaomi cupid vendor tree after 3 attempts"
              exit 1
            fi
            sleep 10
          done

      - name: Fetch SM8450 common vendor tree
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/android"
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          for attempt in 1 2 3; do
            echo "Clone vendor/xiaomi/sm8450-common attempt ${attempt}/3"
            if git clone --depth=1 --single-branch -b "$VENDOR_BRANCH" "$VENDOR_COMMON_REPO" vendor/xiaomi/sm8450-common; then
              break
            fi
            rm -rf vendor/xiaomi/sm8450-common
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not clone SM8450 common vendor tree after 3 attempts"
              exit 1
            fi
            sleep 10
          done

      - name: Disable conflicting WFD vendor module
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android"

          # vendor/xiaomi/sm8450-common builds libwfdservice, which collides
          # with the platform one during the recovery build. Upstream's
          # reference workflow disables it; do the same, idempotently.
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("vendor/xiaomi/sm8450-common/Android.bp")
          if not path.exists():
              print("::error::vendor/xiaomi/sm8450-common/Android.bp is missing")
              sys.exit(1)
          content = path.read_text()

          pattern = re.compile(
              r'(?m)^[ \t]*(?:cc_[a-zA-Z0-9_]+|soong_namespace)[ \t]*\{'
          )

          target = None
          for match in pattern.finditer(content):
              brace = content.find("{", match.start())
              depth = 0
              quote = None
              escaped = False
              end = None

              for i in range(brace, len(content)):
                  char = content[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in ("'", '"', "`"):
                      quote = char
                  elif char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  continue
              block = content[match.start():end]
              if re.search(r'\bname\s*:\s*"libwfdservice"', block):
                  target = (match.start(), end, block)
                  break

          if target is None:
              print("libwfdservice module not found; nothing to do")
              sys.exit(0)

          start, end, block = target
          if re.search(r'\benabled\s*:', block):
              block = re.sub(
                  r'\benabled\s*:\s*(?:true|false)\s*,',
                  'enabled: false,',
                  block,
                  count=1,
              )
          else:
              brace = block.find("{")
              block = (
                  block[:brace + 1]
                  + "\n    enabled: false,"
                  + block[brace + 1:]
              )

          path.write_text(content[:start] + block + content[end:])
          print("libwfdservice disabled")
          PY

          grep -n -A8 -B3 'name: "libwfdservice"' \
            vendor/xiaomi/sm8450-common/Android.bp || true

      - name: Trim projects a recovery build does not need
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/android"

          echo "===== CGROUP MEMORY LIMITS ====="
          cat /proc/self/cgroup || true
          CGROUP="$(awk -F: '{print $3}' /proc/self/cgroup | head -1)"
          for f in memory.max memory.swap.max memory.current memory.swap.current; do
            echo "$f = $(cat "/sys/fs/cgroup${CGROUP}/${f}" 2>/dev/null || echo n/a)"
          done
          free -h

          echo "===== MODULE COUNT BEFORE TRIM ====="
          find . -name Android.bp -not -path "./.repo/*" | wc -l
          find . -name Android.bp -not -path "./.repo/*" -print0 | xargs -0 -r wc -l | tail -1
          echo "--- Android.bp files per top-level dir ---"
          find . -name Android.bp -not -path "./.repo/*" | cut -d/ -f2 | sort | uniq -c | sort -rn | head -25

          # soong_build parses every Android.bp in the tree. The full OrangeFox
          # fox_16.0 tree needs >26GB RAM; the runner has 15.9GB RAM + swap and
          # the kernel OOM-kills soong_build. A recovery image does not compile
          # any of the projects below - the recovery tree itself only references
          # external/{freetype,jsoncpp,libpng,libvterm,lptools,se_omapi},
          # packages/modules/adb and system/{core,libbase,libvintf,libziparchive}.
          TRIM="
          art
          dalvik
          libcore
          frameworks/base
          frameworks/opt/net/ims
          frameworks/opt/net/voip
          frameworks/opt/telephony
          frameworks/libs/binary_translation
          frameworks/libs/gsma_services
          cts
          development
          sdk
          test
          toolchain/pgo-profiles
          hardware/google/aemu
          hardware/nxp/keymint
          hardware/nxp/uwb
          hardware/nxp/weaver
          hardware/qcom/wlan
          kernel/configs
          packages/providers/ContactsKeysProvider
          packages/providers/MediaProvider
          packages/screensavers
          packages/services/Telecomm
          system/apex
          system/authgraph
          system/ca-certificates
          system/chre
          system/dmesgd
          system/gsid
          system/incremental_delivery
          system/linkerconfig
          system/netd
          system/secretkeeper
          system/secure_element
          system/see
          system/server_configurable_flags
          system/teeui
          system/usb_info_tools
          system/zygote
          "
          for d in $TRIM; do
            if [ -d "$d" ]; then
              rm -rf "$d"
              echo "removed $d"
            fi
          done

          # packages/modules/* except the two the recovery tree needs.
          for d in packages/modules/*/; do
            case "$d" in
              packages/modules/adb/|packages/modules/common/) ;;
              *) rm -rf "$d"; echo "removed $d" ;;
            esac
          done

          echo "===== MODULE COUNT AFTER TRIM ====="
          find . -name Android.bp -not -path "./.repo/*" | wc -l
          find . -name Android.bp -not -path "./.repo/*" -print0 | xargs -0 -r wc -l | tail -1
          df -h /

      - name: Validate device tree and recovery source
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android"
          required_files=(
            "$DEVICE_PATH/BoardConfig.mk"
            "$DEVICE_PATH/device.mk"
            "$DEVICE_PATH/AndroidProducts.mk"
            "$DEVICE_PATH/lineage.dependencies"
            "$COMMON_PATH/BoardConfigCommon.mk"
            "hardware/qcom-caf/common/common.mk"
            "hardware/qcom-caf/common/os_pickup_qssi.bp"
            "hardware/qcom-caf/common/os_pickup_sepolicy_vndr.mk"
            "hardware/qcom-caf/sm8450/Android.bp"
            "hardware/qcom-caf/wlan/Android.bp"
            "device/qcom/sepolicy_vndr/SEPolicy.mk"
            "vendor/qcom/opensource/commonsys-intf/display/Android.bp"
            "vendor/qcom/opensource/commonsys/display/Android.bp"
            "vendor/qcom/opensource/display/Android.bp"
            "vendor/qcom/opensource/dataservices/Android.bp"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
          done
          test -d vendor/recovery || { echo "::error::OrangeFox vendor/recovery source is missing"; exit 1; }
          test -d bootable/recovery || { echo "::error::bootable/recovery source is missing"; exit 1; }
          # The LineageOS 24.0 device trees use Soong select(); the old 12.1
          # manifest lacks this parser support. Fail early if the synced Soong
          # checkout does not contain select() implementation/docs.
          if ! grep -RqsE 'select\(' build/soong; then
            echo "::error::Synced Soong source does not expose select() support; verify the OrangeFox fox_16.0 sync completed correctly."
            exit 1
          fi
          test -f vendor/twrp/config/common.mk || {
            echo "::error::vendor/twrp/config/common.mk is missing"
            find vendor -maxdepth 5 -type f -name common.mk -print || true
            exit 1
          }
          echo "===== DEVICE TREE DEPENDENCIES ====="
          cat "$DEVICE_PATH/lineage.dependencies"

      - name: Configure OrangeFox product
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          PRODUCT_MK="$DEVICE_PATH/twrp_cupid.mk"
          PRODUCTS_FILE="$DEVICE_PATH/AndroidProducts.mk"
          cat > "$PRODUCT_MK" <<'EOF'
          #
          # OrangeFox Recovery product for Xiaomi 12 (cupid)
          #
          PRODUCT_RELEASE_NAME := cupid
          DEVICE_PATH := device/xiaomi/cupid
          $(call inherit-product, $(DEVICE_PATH)/device.mk)
          $(call inherit-product-if-exists, $(DEVICE_PATH)/fox_cupid.mk)
          $(call inherit-product, vendor/twrp/config/common.mk)
          PRODUCT_NAME := twrp_cupid
          PRODUCT_DEVICE := cupid
          PRODUCT_BRAND := Xiaomi
          PRODUCT_MODEL := Xiaomi 12
          PRODUCT_MANUFACTURER := Xiaomi
          EOF
          touch "$PRODUCTS_FILE"
          if ! grep -q 'twrp_cupid.mk' "$PRODUCTS_FILE"; then
            printf '\nPRODUCT_MAKEFILES += \\\n    $(LOCAL_DIR)/twrp_cupid.mk\n' >> "$PRODUCTS_FILE"
          fi

      - name: Patch device tree (USB-OTG + theme + NTFS)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/android"
          DEV="$DEVICE_PATH"

          # --- TWRP theme -------------------------------------------------
          # The LineageOS cupid/sm8450-common trees are ROM trees: they carry
          # no TWRP flags at all, so TW_THEME is never set. The recovery's
          # Soong theme picker (bootable/recovery/gui/libfoxui_defaults.go,
          # determineTheme/copyTheme) then finds no ui.xml and aborts the whole
          # build at soong bootstrap with "Could not find ui.xml for TW_THEME:
          # not set". OrangeFox's own sm84xx-common reference sets
          # TW_THEME := portrait_hdpi; cupid is 1080x2400 (portrait, hdpi).
          grep -q '^TW_THEME' "$DEV/BoardConfig.mk" || \
            echo 'TW_THEME := portrait_hdpi' >> "$DEV/BoardConfig.mk"

          # --- USB-OTG ---------------------------------------------------
          # recovery.fstab (inherited from sm8450-common) has no TWRP-visible
          # USB storage entry: its only USB line is an AOSP "voldmanaged" sysfs
          # entry mounted at /storage/usbotg. TWRP's auto-mount looks for a
          # partition named "usb_otg" and never finds one, so an OTG drive is
          # never mounted and never shows up in the GUI storage list.
          #
          # Ship a twrp.flags with an explicit /usb_otg entry instead, the same
          # way OrangeFox's own sm84xx-common reference tree does. The UFS LUNs
          # take /dev/block/sda..sdf, so the first USB mass-storage disk is sdg;
          # sdh1 is kept as the alternate for kernels that enumerate one more
          # UFS LUN.
          mkdir -p "$DEV/recovery/root/system/etc"
          cat > "$DEV/recovery/root/system/etc/twrp.flags" <<'TWRP_FLAGS'
          # mount point   fstype  device           device2          flags
          # Removable storage (USB-OTG)
          /usb_otg     auto    /dev/block/sdg1   /dev/block/sdh1  flags=display="USB OTG";storage;wipeingui;removable;fsflags=utf8
          TWRP_FLAGS

          # Make build/make copy <device>/recovery/root into the recovery
          # ramdisk; that is how twrp.flags reaches /etc/twrp.flags.
          grep -q '^TARGET_RECOVERY_DEVICE_DIRS' "$DEV/BoardConfig.mk" || \
            echo 'TARGET_RECOVERY_DEVICE_DIRS := $(DEVICE_PATH)' >> "$DEV/BoardConfig.mk"

          # NTFS support for OTG drives (matches OrangeFox sm84xx-common).
          grep -q '^TW_INCLUDE_NTFS_3G' "$DEV/BoardConfig.mk" || \
            echo 'TW_INCLUDE_NTFS_3G := true' >> "$DEV/BoardConfig.mk"

          echo "===== twrp.flags ====="
          cat "$DEV/recovery/root/system/etc/twrp.flags"
          echo "===== BoardConfig.mk tail ====="
          tail -n 6 "$DEV/BoardConfig.mk"

      - name: Build recovery image
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=cupid
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          # soong_build is a Go program and the runner has less RAM than the
          # build wants. GOMEMLIMIT makes the runtime GC aggressively instead of
          # growing the heap until the runner is OOM-killed.
          export GOGC=50
          export GOMEMLIMIT=12GiB
          # Build lptools into the recovery ramdisk (/system/bin/lptools).
          # Without it, ROM zips that resize logical partitions abort with
          # "this recovery has no lptools, so the logical partitions cannot
          # be resized".
          export OF_ENABLE_LPTOOLS=1
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          # Keep the cache small: the sync leaves ~25GB of disk and the build
          # still needs room for out/.
          ccache -M 2G

          test -f build/envsetup.sh || { echo "::error::build/envsetup.sh not found"; exit 1; }
          set +e
          set +u
          source build/envsetup.sh
          ENVSETUP_STATUS=$?
          set -e
          echo "envsetup exit status: $ENVSETUP_STATUS"
          declare -F lunch >/dev/null 2>&1 || {
            echo "::error::Function lunch was not loaded by envsetup.sh"
            exit 1
          }
          # Android 16 dropped the "trunk_staging" release config: at
          # android-16.0.0_r1 build/release/release_configs/ defines only
          # ap2a, ap3a, ap4a, bp1a and bp2a (aosp_current -> bp2a), and lunch
          # defaults to bp2a when no release is given.
          lunch twrp_cupid-bp2a-eng || {
            echo "::error::lunch twrp_cupid-bp2a-eng failed"
            echo "===== build/release/release_configs ====="
            ls -1 build/release/release_configs/ 2>/dev/null || true
            echo "===== release_config_map.textproto ====="
            cat build/release/release_config_map.textproto 2>/dev/null || true
            exit 1
          }
          # The recovery's Soong theme picker aborts the whole build when
          # TW_THEME is empty, so prove here that the device BoardConfig value
          # reached the build system.
          echo "TW_THEME=$(get_build_var TW_THEME 2>/dev/null || true)"

          # Log memory/disk pressure every 10s. soong_build is where the
          # runner died in earlier runs; this shows whether RAM/swap/disk was
          # actually exhausted at that moment.
          ( while true; do
              echo "$(date -u +%H:%M:%S) mem=$(free -m | awk '/Mem:/{print $3"/"$2}')MB swap=$(free -m | awk '/Swap:/{print $3"/"$2}')MB disk=$(df -Pk / | awk 'NR==2{print int($4/1048576)}')GB"
              sleep 10
            done ) &
          MONITOR_PID=$!
          trap 'kill $MONITOR_PID 2>/dev/null || true
                echo "===== FINAL free ====="; free -h
                echo "===== FINAL df ====="; df -h /
                echo "===== dmesg tail ====="; sudo dmesg 2>/dev/null | tail -25 || true' EXIT

          mka adbd recoveryimage -j"$ANDROID_JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/build-recovery.log"
          kill $MONITOR_PID 2>/dev/null || true
          trap - EXIT

      - name: Verify recovery image
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          IMAGE="out/target/product/cupid/recovery.img"
          if [[ ! -s "$IMAGE" ]]; then
            echo "::error::Build did not produce recovery.img"
            find out/target/product/cupid -maxdepth 2 -type f -name '*.img' -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$IMAGE"
          sha256sum "$IMAGE" | tee recovery.img.sha256

          # lptools must be present in the recovery ramdisk, otherwise
          # dynamic-partition ROM zips refuse to resize logical partitions.
          RECOVERY_ROOT="out/target/product/cupid/recovery/root"
          if [[ ! -e "$RECOVERY_ROOT/system/bin/lptools" ]]; then
            echo "::error::lptools is missing from the recovery ramdisk"
            ls -l "$RECOVERY_ROOT/system/bin" 2>/dev/null | grep -i 'lp' || true
            exit 1
          fi
          echo "lptools: $(ls -l "$RECOVERY_ROOT/system/bin/lptools")"

          # The USB-OTG fstab entry must be installed next to recovery.fstab,
          # otherwise TWRP never mounts an OTG drive.
          if [[ ! -e "$RECOVERY_ROOT/system/etc/twrp.flags" ]] || \
             ! grep -q '^/usb_otg' "$RECOVERY_ROOT/system/etc/twrp.flags"; then
            echo "::error::twrp.flags without a /usb_otg entry did not reach the recovery ramdisk"
            ls -l "$RECOVERY_ROOT/system/etc" 2>/dev/null | grep -i 'fstab\|flags' || true
            exit 1
          fi
          grep '^/usb_otg' "$RECOVERY_ROOT/system/etc/twrp.flags"

      - name: Upload recovery.img only
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-cupid-recovery
          path: android/out/target/product/cupid/recovery.img
          if-no-files-found: error
          retention-days: 14
